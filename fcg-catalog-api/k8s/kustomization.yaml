# Manifestos da catalog-api.
#
#   kubectl apply -k k8s/
#
# A pipeline (.github/workflows/catalog-api.yml, na raiz do repositorio) troca a imagem antes de aplicar:
#   kustomize edit set image catalog-api=<acr>.azurecr.io/catalog-api:<sha>
# Localmente vale o padrao abaixo, a imagem gerada pelo build-images.ps1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
images:
  - name: catalog-api
    newName: fcg/catalog-api
    newTag: latest
