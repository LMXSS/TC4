# Manifestos da users-api.
#
#   kubectl apply -k k8s/
#
# A pipeline (.github/workflows/users-api.yml, na raiz do repositorio) troca a imagem antes de aplicar:
#   kustomize edit set image users-api=<acr>.azurecr.io/users-api:<sha>
# Localmente vale o padrao abaixo, a imagem gerada pelo build-images.ps1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
images:
  - name: users-api
    newName: fcg/users-api
    newTag: latest
