# Azurite — emulador do Azure Storage.
#
# O host de Azure Functions exige uma conta de storage (AzureWebJobsStorage) para
# controlar leases e singletons sempre que existe trigger que nao e HTTP. Rodando a
# funcao dentro do cluster, o Azurite ocupa esse lugar; na Azure, a Storage Account
# provisionada pelo Bicep.
#
# Fase 4: em vez da conta padrao do emulador (devstoreaccount1, cuja chave e publica),
# o Azurite sobe com uma conta propria cuja chave vem do Secret azurite-secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  labels:
    app: azurite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azurite
  template:
    metadata:
      labels:
        app: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:latest
          args:
            - azurite
            - --blobHost
            - 0.0.0.0
            - --queueHost
            - 0.0.0.0
            - --tableHost
            - 0.0.0.0
            - --skipApiVersionCheck
          env:
            # Formato "conta:chave". Montado pelo k8s/secrets/create-secrets.sh.
            - name: AZURITE_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: azurite-secret
                  key: accounts
          ports:
            - containerPort: 10000
              name: blob
            - containerPort: 10001
              name: queue
            - containerPort: 10002
              name: table
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector:
    app: azurite
  ports:
    - name: blob
      port: 10000
      targetPort: 10000
    - name: queue
      port: 10001
      targetPort: 10001
    - name: table
      port: 10002
      targetPort: 10002
