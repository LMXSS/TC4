apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    app: rabbitmq
data:
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
    default_user = guest
    default_pass = guest
  # Declara as filas notifications-* e os bindings com os exchanges fanout do
  # MassTransit. Sao essas filas que acionam a funcao serverless.
  definitions.json: |
    {
      "rabbit_version": "3.13.0",
      "vhosts": [ { "name": "/" } ],
      "exchanges": [
        {
          "name": "FCG.Messaging.Contracts:UserCreatedEvent",
          "vhost": "/", "type": "fanout",
          "durable": true, "auto_delete": false, "internal": false, "arguments": {}
        },
        {
          "name": "FCG.Messaging.Contracts:PaymentProcessedEvent",
          "vhost": "/", "type": "fanout",
          "durable": true, "auto_delete": false, "internal": false, "arguments": {}
        }
      ],
      "queues": [
        {
          "name": "notifications-user-created",
          "vhost": "/", "durable": true, "auto_delete": false,
          "arguments": { "x-queue-type": "classic" }
        },
        {
          "name": "notifications-payment-processed",
          "vhost": "/", "durable": true, "auto_delete": false,
          "arguments": { "x-queue-type": "classic" }
        }
      ],
      "bindings": [
        {
          "source": "FCG.Messaging.Contracts:UserCreatedEvent",
          "vhost": "/", "destination": "notifications-user-created",
          "destination_type": "queue", "routing_key": "", "arguments": {}
        },
        {
          "source": "FCG.Messaging.Contracts:PaymentProcessedEvent",
          "vhost": "/", "destination": "notifications-payment-processed",
          "destination_type": "queue", "routing_key": "", "arguments": {}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: mgmt
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
          readinessProbe:
            # check_port_connectivity so passa quando o listener AMQP aceita conexoes;
            # "ping" responde antes disso e libera dependentes cedo demais.
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: mgmt
      port: 15672
      targetPort: 15672
