apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secret
  labels:
    app: catalog-api
type: Opaque
stringData:
  # Precisa ser identica a chave da Users API (que assina) e a do Kong (que valida na borda).
  jwt-key: "CHANGE_ME_DEV_KEY_MIN_32_CHARS_LONG!!"
  connection-string: "Data Source=/app/data/catalog.db"
  rabbitmq-username: "guest"
  rabbitmq-password: "guest"
  # Connection strings de MongoDB e Redis ficam no Secret porque carregam
  # credenciais assim que o ambiente sai do cluster local.
  mongo-connection-string: "mongodb://mongo:27017"
  redis-connection-string: "redis:6379"
