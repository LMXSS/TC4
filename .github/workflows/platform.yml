# Deploy da plataforma no AKS (Fase 4).
#
# Cuida de tudo o que nao pertence a um microsservico: Secrets, bancos (PostgreSQL,
# MongoDB, Redis), Elasticsearch, RabbitMQ, Kong, observabilidade e HPAs. Os servicos
# (Users, Catalog, Payments, Functions) tem pipeline propria, ao lado desta.
#
# Roda em push na main que mexa na infra, ou manualmente (Actions > Run workflow).
# Na primeira vez rode manualmente, antes das pipelines dos servicos: elas dependem dos
# Secrets e dos bancos criados aqui.
#
# Secrets do repositorio:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID     (OIDC)
#   JWT_KEY, POSTGRES_PASSWORD, MONGO_PASSWORD, REDIS_PASSWORD, RABBITMQ_PASSWORD,
#   ELASTIC_PASSWORD, GRAFANA_PASSWORD, SEED_ADMIN_PASSWORD, AZURITE_ACCOUNT_KEY
# Variables do repositorio: AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
#
# Tudo isso e gravado pelo infra/azure/setup-azure.ps1.
name: Platform deploy

on:
  push:
    branches: [main]
    paths:
      - "fcg-platform/k8s/**"
      - "fcg-platform/gateway/**"
      - "fcg-platform/observability/**"
      - ".github/workflows/platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "fcg-platform/k8s/**"
      - "fcg-platform/gateway/**"
      - "fcg-platform/observability/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: platform-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: fcg-platform

jobs:
  validate:
    name: Validar manifestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le cada manifesto sem precisar de cluster: pega YAML quebrado ainda no pull request.
      - name: Sintaxe dos manifestos
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          erros = 0
          for f in sorted(glob.glob("k8s/**/*.yaml", recursive=True)):
              for doc in yaml.safe_load_all(open(f)):
                  if doc is None:
                      continue
                  if "apiVersion" not in doc or "kind" not in doc:
                      print(f"::error file={f}::documento sem apiVersion/kind"); erros += 1
                  else:
                      print(f"{f}: {doc['kind']}/{doc['metadata']['name']}")
          sys.exit(1 if erros else 0)
          PY
          bash -n k8s/secrets/create-secrets.sh

      # Garante que nenhum manifesto voltou a carregar credencial em texto puro.
      - name: Nenhum Secret com valor nos manifestos
        run: |
          if grep -rlE '^kind: Secret' k8s/ --include='*.yaml'; then
            echo "::error::Encontrado 'kind: Secret' em manifesto versionado. Secrets sao criados por k8s/secrets/create-secrets.sh."
            exit 1
          fi

  deploy:
    name: Deploy da plataforma
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login na Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Contexto do cluster
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      # Os valores existem so na memoria do runner, vindos dos GitHub Secrets, e vao
      # direto para Secrets do Kubernetes. O GitHub mascara qualquer um deles nos logs.
      - name: Secrets do Kubernetes
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          AZURITE_ACCOUNT_KEY: ${{ secrets.AZURITE_ACCOUNT_KEY }}
        run: ./k8s/secrets/create-secrets.sh

      - name: ConfigMaps gerados dos arquivos versionados
        run: |
          kubectl create configmap kong-declarative --from-file=kong.yml=gateway/kong.yml \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap grafana-dashboards \
            --from-file=fcg-overview.json=observability/grafana/dashboards/fcg-overview.json \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Bancos, busca e mensageria
        run: |
          for f in postgres rabbitmq mongo redis elasticsearch mailpit azurite; do
            kubectl apply -f "k8s/$f.yaml"
          done
          kubectl rollout status statefulset/postgres --timeout=300s
          kubectl rollout status statefulset/elasticsearch --timeout=600s
          for d in rabbitmq mongo redis mailpit azurite; do
            kubectl rollout status deployment/"$d" --timeout=300s
          done

      - name: Gateway e observabilidade
        run: |
          kubectl apply -f k8s/gateway/
          kubectl apply -f k8s/observability/
          # O kong.yml chega por ConfigMap; reinicia o Kong para ler a versao nova.
          kubectl rollout restart deployment/kong
          kubectl rollout status deployment/kong --timeout=300s

      # HPAs um a um: apontam para Deployments que podem ainda nao existir na primeira
      # execucao — o HPA fica aguardando e passa a agir quando o servico sobe.
      - name: Escala automatica
        run: |
          kubectl apply -f k8s/scaling/hpa-payments-api.yaml
          kubectl apply -f k8s/scaling/hpa-notifications-function.yaml

      - name: Resumo
        if: always()
        run: |
          IP=$(kubectl get svc kong-proxy -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || true)
          {
            echo "### Plataforma FCG no AKS"
            echo ""
            echo "Gateway (Azure Load Balancer): http://${IP:-<aguardando IP>}"
            echo ""
            echo '```'
            kubectl get pods -o wide
            echo ""
            kubectl get svc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
