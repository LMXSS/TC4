# Importa exchanges, filas e bindings no start do broker.
#
# As filas notifications-* existem para a funcao serverless: o RabbitMQTrigger escuta
# uma fila, enquanto o MassTransit publica em exchanges fanout com o nome do tipo do
# evento. Os bindings declarados aqui ligam um ao outro. Os exchanges vem com exatamente
# os mesmos atributos que o MassTransit usa (fanout, durable, sem auto-delete), entao
# nao ha conflito quando os servicos sobem e declaram os seus.
#
# Atencao: quando ha load_definitions, o RabbitMQ NAO cria o usuario padrao e ignora
# RABBITMQ_DEFAULT_USER/PASS. O usuario guest e as permissoes vem declarados dentro do
# proprio definitions.json.
load_definitions = /etc/rabbitmq/definitions.json
